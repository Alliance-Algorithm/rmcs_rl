name: CI
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: qzhhhi/rmcs-develop
      options: --user 0
    steps:
      - uses: actions/checkout@v4
        with:
          path: rmcs_rl
      - name: Build in RMCS workspace
        shell: bash
        run: |
          set -eo pipefail
          git clone --depth 1 --recurse-submodules https://github.com/Alliance-Algorithm/RMCS.git /tmp/RMCS
          mkdir -p /tmp/RMCS/rmcs_ws/src/rmcs_rl
          tar -C "${GITHUB_WORKSPACE}/rmcs_rl" --exclude=".git" -cf - . | tar -C /tmp/RMCS/rmcs_ws/src/rmcs_rl -xf -
          source /opt/ros/jazzy/setup.bash
          cd /tmp/RMCS/rmcs_ws
          colcon build --packages-up-to rmcs_rl --cmake-args -DBUILD_TESTING=OFF
