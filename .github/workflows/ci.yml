name: CI

on:
  pull_request:
    paths:
      - "src/**"
      - "models/**"
      - "tool/**"
      - "CMakeLists.txt"
      - "package.xml"
      - "plugins.xml"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RMCS_REPO: https://github.com/Alliance-Algorithm/RMCS.git
  RMCS_REF: main

jobs:
  build-and-contract-check:
    runs-on: ubuntu-latest
    container:
      image: qzhhhi/rmcs-develop
      options: --user 0

    steps:
      - name: Checkout rmcs_rl
        uses: actions/checkout@v4
        with:
          path: rmcs_rl

      - name: Clone RMCS workspace
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules --branch "${RMCS_REF}" "${RMCS_REPO}" /tmp/RMCS
          mkdir -p /tmp/RMCS/rmcs_ws/src/rmcs_rl
          tar -C "${GITHUB_WORKSPACE}/rmcs_rl" --exclude=".git" -cf - . \
            | tar -C /tmp/RMCS/rmcs_ws/src/rmcs_rl -xf -

      - name: Build rmcs_rl (colcon)
        shell: bash
        working-directory: /tmp/RMCS/rmcs_ws
        run: |
          set -euo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          colcon build --packages-up-to rmcs_rl

      - name: Check shipped models (self-check, metadata optional)
        shell: bash
        working-directory: /tmp/RMCS/rmcs_ws/src/rmcs_rl
        run: |
          set -euo pipefail

          # The base image may not ship pip for the system Python.
          if ! python3 -m pip --version >/dev/null 2>&1; then
            echo "python3-pip is missing; installing it..."
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends python3-pip
          fi

          python3 -m pip install --quiet --no-cache-dir \
              --break-system-packages onnx onnxruntime numpy \
            || python3 -m pip install --quiet --no-cache-dir onnx onnxruntime numpy

          shopt -s nullglob
          models=(models/*.onnx)
          if [ "${#models[@]}" -eq 0 ]; then
            echo "No models under models/, nothing to check"
          fi
          for model in "${models[@]}"; do
            echo "== ${model} =="
            python3 tool/check_policy_contract.py "$model"
          done

          # Negative test: a wrong expected size must be rejected with a shape
          # error (guards against a false pass when the tool fails for an
          # unrelated reason, e.g. a missing model file).
          if [ "${#models[@]}" -gt 0 ]; then
            if output="$(python3 tool/check_policy_contract.py \
                "${models[0]}" --obs 999 --act 999 2>&1)"; then
              echo "FAIL: contract mismatch should have been rejected"
              exit 1
            fi
            if ! grep -q "FAIL obs shape" <<<"${output}"; then
              echo "FAIL: expected a shape mismatch, got:"
              echo "${output}"
              exit 1
            fi
            echo "negative contract test OK"
          fi

      - name: Toolchain regression (layout contract tools)
        shell: bash
        working-directory: /tmp/RMCS/rmcs_ws/src/rmcs_rl
        run: |
          set -euo pipefail
          bash tool/test_layout_contract.sh
