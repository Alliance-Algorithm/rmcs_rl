# rmcs_rl 配置参考（executor.yaml）

rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::<YourRobotHardware> -> <robot>

      # RlController：核心策略部署控制器
      # 对硬件的要求（接口路径由 joint_base_path + 关节名 + 后缀拼接，必须与硬件一致）：
      #   输入：{base}/{joint}/{angle,velocity}（后缀可分组覆盖）、{base}/imu/{quaternion,angular_velocity}
      #   输出：{base}/{joint}/control_torque
      #   指令：{base}/command/{vx,yaw_rate,height,state}、{base}/reset_count（可缺省）
      - rmcs::rl::RlController -> rl_controller

      # 调试期建议再挂指令源（发 state 命令/复位，无它 FSM 收不到指令会停在 INIT）：
      # - rmcs::rl::RlDebugCommand -> rl_debug_command

rl_controller:
  ros__parameters:
    # ---- 模型与推理 ----
    # 相对路径相对 rmcs_rl 包 share 目录解析（模型放 rmcs_rl/models/ 随 install/ 同步）；
    # 也支持绝对路径。
    rl_model_path: "models/policy.onnx"
    # 推理频率必须与训练控制频率一致（sim dt × decimation）
    rl_inference_frequency: 50.0
    # 发布 /rl/{observation,action,state} 调试输出（ros2 topic echo / rqt 用）
    rl_publish_network_io: true

    # ---- 机器人描述（必填，训练 DOF 序）----
    joint_names: [rf0, rf1, r_wheel, lf0, lf1, l_wheel]   # 例：6 DOF 轮腿
    joint_base_path: "/wheel_leg"                          # 与硬件组件接口前缀一致
    # PD 分组：位置组（动作→角度目标→PD→力矩）；速度组（动作→速度目标→PD→力矩）
    position_pd_joints: [0, 1, 3, 4]                       # 例：腿
    velocity_pd_joints: [2, 5]                             # 例：轮；无速度组则整段省略
    # 关节反馈接口后缀（分组可覆盖）。默认 RMCS 约定 angle/velocity；
    # 训练坐标系与硬件不一致的车型覆盖（如 4 腿悬挂用 /physical_angle）。
    position_group_angle_suffix: "/angle"
    position_group_velocity_suffix: "/velocity"
    velocity_group_angle_suffix: "/angle"
    velocity_group_velocity_suffix: "/velocity"

    # ---- 模型合同尺寸（必填：无默认、不按车型推导；维度须与模型 shape 及
    #      doc/model-contract.md 的观测布局长度一致，不一致会启动报错）----
    rl_obs_size: 28               # 例：与上方 6 DOF 轮腿示例配套
    rl_action_size: 6             # 例：每关节一个动作

    # ---- 位置组目标中位/限位与动作换算（与训练 default_dof_pos / action_scale 一致）----
    default_dof_pos: [-0.5, -0.35, 0.0, 0.5, 0.35, 0.0]    # 例：轮腿站立位
    dof_pos_limits_lower: [-100.0, -0.9, -100.0, -100.0, -0.65, -100.0]
    dof_pos_limits_upper: [100.0, 0.65, 100.0, 100.0, 0.9, 100.0]
    position_action_scale: 0.5
    velocity_action_scale: 10.0
    max_velocity: 100.0

    # ---- PD 增益与力矩限幅（与训练一致；限幅同时受电机能力约束）----
    position_kp: 200.0
    position_kd: 4.0
    velocity_kp: 20.0
    velocity_kd: 0.5
    position_torque_max: 35.0
    velocity_torque_max: 6.0

    # ---- 观测缩放（与训练 normalization.obs_scales 一致）----
    obs_height_scale: 5.0
    obs_ang_vel_scale: 0.5
    obs_gravity_scale: 1.0
    obs_dof_pos_scale: 1.0
    obs_dof_vel_scale: 0.1
    clip_observations: 100.0
    clip_actions: 100.0

    # ---- 指令范围（vx/yaw_rate 平移指令限幅；height 为目标高度）----
    motion_linear_x_min: -2.5
    motion_linear_x_max: 2.5
    motion_angular_z_min: -3.0
    motion_angular_z_max: 3.0
    command_height_min: 0.20
    command_height_max: 0.42
    default_command_height: 0.22

    # ---- FSM / PREPARE ----
    # true = 上电自动进 RL（须先验证 PREPARE 安全）；调试期保持 false，用 RlDebugCommand
    # 手动 pub state=2 → 等 PREPARE 完成 → state=3。
    auto_enter_rl: false
    # 预备位（按 position_pd_joints 序，长度须一致）= 训练 default_dof_pos 通常即可
    prepare_dof_pos: [-0.5, -0.35, 0.5, 0.35]
    prepare_kp: 80.0
    prepare_kd: 2.0
    prepare_max_velocity: 1.0          # PREPARE 插值速度上限（rad/s）
    prepare_reach_threshold: 0.02

# ----------------------------------------------------------------------------
# RlDebugCommand：调试指令源（topic → command 接口），仅供调试/验证
#   输入：{command_base}/debug/command  Float64MultiArray [vx, yaw_rate, height, state]
#        {command_base}/debug/reset     Bool（true → reset_count 递增）
#   输出：{command_base}/command/{vx,yaw_rate,height,state}、{command_base}/reset_count
# ----------------------------------------------------------------------------
rl_debug_command:
  ros__parameters:
    # 与 RlController 的 joint_base_path 同前缀
    command_base: "/wheel_leg"
