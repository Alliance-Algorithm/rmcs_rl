
rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::WheelLegInfantryRL -> wheel_leg_infantry_rl
      - rmcs_core::controller::chassis::WheelLegChassisController -> wheel_leg_chassis_controller
      - rmcs::rl::RlBridge -> rl_bridge
      - rmcs::rl::PolicyServer -> policy_server

wheel_leg_infantry_rl:
  ros__parameters:
    board_serial: ""
    hip_kp: 200.0
    hip_kd: 4.0
    knee_kp: 200.0
    knee_kd: 4.0

wheel_leg_chassis_controller:
  ros__parameters:
    rl_state_path: "/wheel_leg/rl/state"
    vx_max: 2.5
    yaw_rate_max: 3.0
    heading_kp: 3.0
    deadzone: 0.08
    command_height_min: 0.20
    command_height_max: 0.42
    default_command_height: 0.22

rl_bridge:
  ros__parameters:
    rl_base: "/wheel_leg/rl"
    policy_rate: 50.0
    max_action_age: 0.04            # 缺省 = 2 / policy_rate；超时 → valid=0（绝不保持旧动作）

    rl_obs_size: 28
    rl_action_size: 6

    enable_interface: "/wheel_leg/rl/enable"
    enable_default: false
    invalid_value: "nan"            # 必须加引号！不加会被 YAML 解析成 float，桥启动即失败
    reset_interface: "/chassis/reset_count"
    expected_model_id: "0"

    joint_names: [left_hip_joint, left_knee_joint, left_wheel, right_hip_joint, right_knee_joint, right_wheel]
    joint_base_path: "/wheel_leg"
    joint_angle_suffix: "/angle"
    joint_velocity_suffix: "/velocity"
    joint_torque_suffix: "/torque"
    default_joint_pos:
      left_hip_joint: -0.5v
      left_knee_joint: -0.35
      left_wheel: 0.0
      right_hip_joint: 0.5
      right_knee_joint: 0.35
      right_wheel: 0.0

    observation_terms:
      - index=0  path=/chassis/control_velocity take=x
      - index=1  path=/chassis/control_velocity take=y
      - index=2  path=/chassis/control_velocity take=z
      - index=3  path=/chassis/control_height scale=5.0
      - index=4  path=/wheel_leg/imu/angular_velocity take=vec3 scale=0.5
      - index=7  path=/wheel_leg/imu/quaternion transform=projected_gravity
      - index=10 type=joint_pos joints=left_hip_joint,left_knee_joint relative=true
      - index=12 type=joint_pos joints=left_wheel zero=true
      - index=13 type=joint_pos joints=right_hip_joint,right_knee_joint relative=true
      - index=15 type=joint_pos joints=right_wheel zero=true
      - index=16 type=joint_vel joints=left_hip_joint,left_knee_joint,left_wheel,right_hip_joint,right_knee_joint,right_wheel scale=0.1
      - index=22 type=last_action

    action_terms:
      - index=0 output=/wheel_leg/rl/action/left_hip_joint
      - index=1 output=/wheel_leg/rl/action/left_knee_joint
      - index=2 output=/wheel_leg/rl/action/left_wheel
      - index=3 output=/wheel_leg/rl/action/right_hip_joint
      - index=4 output=/wheel_leg/rl/action/right_knee_joint
      - index=5 output=/wheel_leg/rl/action/right_wheel

policy_server:
  ros__parameters:
    rl_base: "/wheel_leg/rl"                    # 必须与桥一致
    rl_model_path: "models/wheel_leg_V1.onnx"
    input_name: "obs"
    output_name: "actions"
    normalization_from_metadata: true
    publish_status: false
    status_rate: 2.0
